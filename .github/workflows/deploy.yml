name: Déploiement

# Déploiement continu : après une CI verte sur main (ou à la demande), connexion SSH au VPS et ./deploy/deploy.sh.
# Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée dédiée au déploiement), VPS_KNOWN_HOSTS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déployer sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd ~/knowlist && ./deploy/deploy.sh $SHA"
